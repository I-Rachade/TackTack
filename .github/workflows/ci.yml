name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint (syntax check)
        run: find src public test -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build
        run: npm run build --if-present

      - name: Tests
        run: npm test
